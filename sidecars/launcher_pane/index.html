<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>File Launcher</title>
  <link rel="stylesheet" href="/styles.css" />
  <script src="/preload.js"></script>
</head>
<body>
  <div class="shell">
    <!-- Top Header Toolbar -->
    <header class="header">
      <div class="nav-tabs">
        <button class="nav-tab active" id="tabSession" data-tab="session">
          <span>当前产出</span>
          <span class="tab-count" id="countSession">0</span>
        </button>
        <button class="nav-tab" id="tabRecent" data-tab="recent">
          <span>项目文件</span>
          <span class="tab-count" id="countRecent">0</span>
        </button>
        <button class="nav-tab" id="tabReader" data-tab="reader">
          <span>文档预览</span>
        </button>
      </div>
      <div class="header-tools">
        <input type="text" id="searchInput" class="search-input" placeholder="筛选文件..." />
        <button class="icon-btn" id="themeToggleBtn" title="切换深浅主题">
          <svg viewBox="0 0 24 24" class="svg-icon"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
        </button>
        <button class="icon-btn" id="refreshBtn" title="刷新列表">
          <svg viewBox="0 0 24 24" class="svg-icon"><path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/><path d="M16 16h5v5"/></svg>
        </button>
      </div>
    </header>

    <!-- File List View -->
    <main class="list-container" id="fileListContainer">
      <div class="empty-state">正在加载文件列表...</div>
    </main>

    <!-- Built-in Document Reader View (For .docx, .md, .pptx, .xlsx) -->
    <section class="reader-container hidden" id="readerView">
      <div class="reader-bar">
        <div class="reader-bar-left">
          <button class="btn btn-ghost" id="readerBackBtn">
            <svg viewBox="0 0 24 24" class="svg-icon"><path d="m15 18-6-6 6-6"/></svg>
            <span>返回</span>
          </button>
          <span class="ext-tag" id="readerBadge">DOCX</span>
          <span class="reader-filename" id="readerTitle">未选择文档</span>
        </div>
        <div class="reader-bar-actions">
          <div class="split-btn-group">
            <button class="btn btn-primary split-main" id="readerOpenDefaultBtn">
              <span>打开</span>
              <svg viewBox="0 0 24 24" class="svg-icon-sm"><path d="M7 17 17 7"/><path d="M7 7h10v10"/></svg>
            </button>
            <button class="btn btn-primary split-trigger" id="readerOpenWithBtn" title="选择打开方式">
              <svg viewBox="0 0 24 24" class="svg-icon-sm"><path d="m6 9 6 6 6-6"/></svg>
            </button>
          </div>
          <button class="btn btn-secondary" id="readerRevealBtn" title="在资源管理器中显示">
            <svg viewBox="0 0 24 24" class="svg-icon"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/></svg>
            <span>定位</span>
          </button>
        </div>
      </div>
      <div class="reader-canvas" id="readerBody">
        <div class="empty-state">在文件列表中点击任意文档或「预览」按钮，即可在此直接阅读内容。</div>
      </div>
    </section>

    <!-- Open With Popover / Modal -->
    <div class="modal-overlay hidden" id="openWithModal">
      <div class="modal-dialog">
        <div class="modal-head">
          <span class="modal-head-title">选择打开方式</span>
          <button class="icon-btn" id="closeModalBtn">✕</button>
        </div>
        <div class="modal-sub" id="modalFileName">filename.docx</div>
        <div class="app-menu-list" id="appGrid"></div>
        <label class="modal-foot-check">
          <input type="checkbox" id="rememberExtCheck" />
          <span>始终使用所选应用打开 <code id="modalExtText">.docx</code> 文件</span>
        </label>
      </div>
    </div>

    <div class="toast hidden" id="toastMsg">已执行</div>
  </div>
  <script src="/app.js"></script>
</body>
</html>
